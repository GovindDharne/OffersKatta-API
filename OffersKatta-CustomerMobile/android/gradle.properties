org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin's incremental compiler. It tries to compute relative paths
# between Flutter-plugin sources (under PUB_CACHE on C:\) and the project's
# android/ dir (on D:\), which throws "different roots" on Windows when
# pub cache and the project live on different drives. Compile is slightly
# slower per session but reliable. KT-52344.
kotlin.incremental=false
